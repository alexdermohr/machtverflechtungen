  type: parliamentary_inquiry_report
  primary: true
  tier: A
  url: https://dserver.bundestag.de/btd/16/134/1613400.pdf
  accessed: '2026-10-04'
  locator: Drucksache 16/13400; Teil B, S. 344–345 zur festgestellten Foertsch-Einflussnahme; Teil C H, S. 414–418 zur Mehrheitsbewertung der Journalistenobservationen; Teil G, S. 963–964 für die ausdrücklich getrennte Sondervotums-/Schäfer-Bericht-Passage zu Mascolo.
