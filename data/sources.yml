  locator: "Gedruckte S. 3–4/5, Antworten 1 und 2.1–5; Regierungsantwort 29.07.2025 zu VS-Vertraulich-Auswertungsdienstvorschrift 20.09.1978 und fehlender Frist für Übermittlung durch menschliche Quellen an BayLfV"
  notes: "1978er Dienstvorschrift ist VS-Vertraulich und als Volltext nicht öffentlich geprüft. Laut späterer Landesregierung enthält sie keine Frist Quelle→BayLfV; daraus folgt weder fehlende Frist BayLfV→Polizei noch die tatsächliche Einhaltung sonstiger Kooperationsvorschriften. Anfragen an Bundesbehörden bleiben nach Landesantwort außerhalb ihrer Zuständigkeit."
