    notes: "US-Kupferkonzern; GAO 1976 dokumentiert OPIC-Ablehnung zweier Forderungen über rund 154 Mio. USD 1972 und Haftungs-Schiedsspruch 1975; GAO 1977 und DFC FY77 dokumentieren 95,092 Mio. USD Cash/Guarantee-Abwicklung 31.03.1977. Keine Behauptung einer bewiesenen CIA-Weisung."
