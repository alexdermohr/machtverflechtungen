site_name: Machtverflechtungen
site_description: Quellengebundene Forschung zu politischen, staatlichen, geheimdienstlichen und wirtschaftlichen Machtverflechtungen
site_url: https://alexdermohr.github.io/machtverflechtungen/
repo_url: https://github.com/alexdermohr/machtverflechtungen
repo_name: alexdermohr/machtverflechtungen
copyright: Forschung und Daten CC BY 4.0 · Code MIT

theme:
  name: material
  language: de
  palette:
    - scheme: default
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Dunkles Erscheinungsbild
    - scheme: slate
      primary: blue grey
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Helles Erscheinungsbild
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.instant
    - navigation.tracking
    - navigation.path
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight

extra_css:
  - assets/stylesheets/extra.css

plugins:
  - search:
      lang:
        - de
        - en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      toc_depth: 2
      permalink: true
  - tables
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Start: index.md
  - Fallakten:
      - Alle Fälle: faelle/index.md
      - Nachrichtendienste & Informanten:
          - Langemann: faelle/de/langemann-informationsnetz-1976-1982.md
          - Peter Urbach: faelle/de/peter-urbach-verfassungsschutz.md
          - Organisation Gehlen: faelle/de/organisation-gehlen.md
          - Celler Loch: faelle/de/celler-loch.md
      - Rechtsterrorismus & Ermittlungen:
          - Deutsche Aktionsgruppen / Manfred Roeder: faelle/de/deutsche-aktionsgruppen-roeder-1980-1998.md
          - Oktoberfestattentat 1980: faelle/de/oktoberfestattentat-1980.md
          - NSU / Quellenführung: faelle/de/nsu-v-leute-aktenvernichtung.md
          - NSU / Yozgat und Temme: faelle/de/nsu-yozgat-temme.md
          - Thüringer Heimatschutz: faelle/de/thueringer-heimatschutz-tino-brandt.md
          - Technischer Dienst des BDJ: faelle/de/technischer-dienst-bdj.md
      - Internationale Anschläge:
          - Piazza Fontana: faelle/it/piazza-fontana.md
          - La Belle 1986: faelle/de/la-belle-1986.md
      - Politik, Wirtschaft & Medien:
          - Cum-Ex / Warburg: faelle/de/cum-ex-warburg-steuerverfahren.md
          - Transatlantische Mediennetzwerke: faelle/de/transatlantik-mediennetzwerk-2017-2026.md
          - Nachrichtendienste und Medien: faelle/de/medien-nachrichtendienst-crosslayer.md
  - Beziehungen & Daten:
      - Netzwerk: generated/network.md
      - Netzwerkdiagramm: generated/network-graph.md
      - Chronologie: generated/timeline.md
      - Personen & Organisationen: generated/entities.md
      - Regionen: generated/regions.md
      - Offene Hypothesen: generated/hypotheses.md
  - Quellen & Akten:
      - Quellenkatalog: quellen/index.md
      - Oktoberfestattentat / Spurenprüfung: quellen/oktoberfestattentat-1980-spurenpruefung.md
      - Westdeutsche Dienste & Linksterrorismus: quellen/westdeutsche-dienste-linksterrorismus-1968-1996.md
      - RAF / westdeutsche Behördenakten 1975–1992 (Vorgeschichte ab 1972): quellen/raf-westdeutsche-staatsakten-1975-1992.md
      - RAF / Originalanlagen und Aussagegenehmigung 1977: quellen/raf-aktenanlage-aussagegenehmigung-1977.md
      - Panorama 1971 / Filmanalyse: quellen/panorama-1971-filmanalyse.md
      - LCPROWL / CIA-Untersuchungsakten 1952–1953: quellen/lcprowl-1952-1953-us-ermittlungen.md
      - LCPROWL / OPC-Akten August 1950: quellen/lcprowl-1950-opc-planung.md
      - BDJ / Bundestagsprotokolle 1951–1952: quellen/bdj-gesamtdeutscher-ausschuss-1951-1952.md
      - BDJ und VFF / Französische Archivakten 1946–1955: quellen/bdj-vff-franzoesische-archive-1946-1955.md
      - ADK / Bundesfinanzierung und Haushaltsakten 1954–1957: quellen/adk-bundesfinanzierung-1954-1957.md
      - ADK / Bundesmittel, Wahlkampfhilfe und Haushaltsverhandlungen 1967–1968: quellen/adk-parteifinanzierung-bundeskasse-1967-1968.md
      - LCPROWL / Amendment No. 3 (1952): quellen/lcprowl-amendment3-1952.md
  - Hintergrund:
      - Mechanismen:
          - Überblick: mechanismen/index.md
          - Strategie der Spannung: mechanismen/strategie-der-spannung.md
      - Organisationen:
          - Überblick: organisationen/index.md
          - Atlantik-Brücke: organisationen/atlantik-bruecke.md
      - Methodik: methodik.md
      - Begriffe: begriffe.md